<!DOCTYPE   html>
<html lang="pl">
<head>
 <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" >
 <meta name="description" content="ArrowLang IDE — run ArrowLang programs in your browser.">
    <title>ArrowLang IDE</title>
 <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
 <script defer src="app.js"></script>
</head>
<body>
<main class="ide" >
    <nav class="toolbar" aria-label="IDE controls">
      <button id="run-code" type="button" disabled>Run</button>
        <button id="load-example" type="button">Example</button>
      <button id="load-snake" type="button">Snake</button>
          <button id="stop-code" type="button" disabled>Stop</button>
      <button id="clear-code" type="button">Clear</button>
  </nav>

    <section class="editor-section" aria-label="Code editor" >
      <label for="code-editor">Code editor</label>
        <div class="editor-wrap">
        <pre class="line-numbers" id="line-numbers" aria-hidden="true" >1</pre>
          <textarea id="code-editor" spellcheck="false" autocapitalize="off" autocomplete="off"
          autocorrect="off" aria-label="Edytor kodu ArrowLang"></textarea>
      </div>
   </section>

    <pre class="output" id="console-output" aria-live="polite" hidden ></pre>

    <section class="game-section" id="game-panel" hidden aria-label="Game preview">
       <canvas id="game-canvas" width="600" height="400" tabindex="0"
        aria-label="Obszar gry ArrowLang"></canvas>
         <p>Controls: arrows · restart: R · stop: Stop</p>
    </section>
 </main>
</body>
</html>
